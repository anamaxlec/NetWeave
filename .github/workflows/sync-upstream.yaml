name: Sync upstream

on:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）检查一次上游更新
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/sync-upstream.yaml'
      - '.github/scripts/preserve_downstream.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/AIsouler/MyClash.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream into main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge upstream/main --no-edit; then
            echo "Upstream merged without conflicts"
            exit 0
          fi

          echo "Merge conflict detected; resolving known downstream files"
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

          if [ "${#conflicts[@]}" -eq 0 ]; then
            echo "::error::git merge failed but no unmerged paths were reported"
            git merge --abort || true
            exit 1
          fi

          for file in "${conflicts[@]}"; do
            case "$file" in
              README.md)
                # README 是 NetWeave 自己的项目说明。
                git checkout --ours -- "$file"
                ;;
              Config/mihomoConfig.yaml|Config/mihomoConfigLite.yaml|Script/Script.js|Script/mihomoScript.js)
                # 核心文件先采用上游最新结构，再统一重放 NetWeave patch。
                git checkout --theirs -- "$file"
                ;;
              *)
                echo "::error::Unknown merge conflict: $file"
                git merge --abort || true
                exit 1
                ;;
            esac
            git add -- "$file"
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain"
            git merge --abort || true
            exit 1
          fi

          git commit --no-edit

      - name: Preserve downstream customizations
        run: python3 .github/scripts/preserve_downstream.py

      - name: Run integration tests
        run: |
          npm --prefix Test install
          node Test/run-tests.js

      - name: Commit protected downstream changes
        run: |
          git add Config/mihomoConfig.yaml Config/mihomoConfigLite.yaml Script/Script.js Script/mihomoScript.js
          if git diff --cached --quiet; then
            echo "Downstream customizations already intact"
          else
            git commit -m "perf: preserve NetWeave downstream customizations"
          fi

      - name: Push
        run: git push origin main
